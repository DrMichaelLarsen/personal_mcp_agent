services:
  personal-productivity-mcp:
    build: .
    image: ghcr.io/drmichaellarsen/personal_mcp_agent:latest
    container_name: personal-productivity-mcp
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8001:8000"
    volumes:
      # OAuth refresh updates token.pickle, so this mount must be writable.
      - /mnt/user/appdata/personal-productivity-mcp/secrets:/config/secrets
      - /mnt/user/appdata/personal-productivity-mcp/data:/data
